<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="quranicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>
  <!-- Rounded squircle container matching header logo -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#quranicGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="#a7f3d0" stroke-width="8" stroke-opacity="0.4" />
  <!-- Arabic Letter Qaf (ق) -->
  <text x="256" y="335" text-anchor="middle" font-family="system-ui, -apple-system, 'Amiri Quran', 'Amiri', 'Traditional Arabic', serif" font-size="310" font-weight="bold" fill="#ffffff">ق</text>
</svg>
